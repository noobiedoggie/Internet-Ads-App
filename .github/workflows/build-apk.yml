name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a GitHub Release
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add these as repository secrets for a production build.
      # Without them you get the demo (Google test ads, local balance).
      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f "$RUNNER_TEMP/release.jks" ]; then export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"; fi
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: gigabee-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # Puts the installable APK on the repo's Releases page (open it on your phone to install).
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GigaBee.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GigaBee.apk \
            --target "$GITHUB_SHA" \
            --title "GigaBee (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download GigaBee.apk on your Android phone and open it to install."
